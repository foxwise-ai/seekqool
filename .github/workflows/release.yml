name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Universal Binary
        run: |
          cd macOS
          # Build for ARM64
          swift build -c release --arch arm64
          mv .build/release/SeekQool .build/SeekQool-arm64

          # Clean and build for x86_64
          rm -rf .build/release
          swift build -c release --arch x86_64
          mv .build/release/SeekQool .build/SeekQool-x86_64

          # Combine into universal binary
          mkdir -p .build/release
          lipo -create .build/SeekQool-arm64 .build/SeekQool-x86_64 -output .build/release/SeekQool

      - name: Create App Icon
        run: |
          cd macOS
          ICON_SRC="assets/icon.png"
          ICONSET="AppIcon.iconset"

          mkdir -p "${ICONSET}"

          # Generate all required sizes
          sips -z 16 16     "${ICON_SRC}" --out "${ICONSET}/icon_16x16.png"
          sips -z 32 32     "${ICON_SRC}" --out "${ICONSET}/icon_16x16@2x.png"
          sips -z 32 32     "${ICON_SRC}" --out "${ICONSET}/icon_32x32.png"
          sips -z 64 64     "${ICON_SRC}" --out "${ICONSET}/icon_32x32@2x.png"
          sips -z 128 128   "${ICON_SRC}" --out "${ICONSET}/icon_128x128.png"
          sips -z 256 256   "${ICON_SRC}" --out "${ICONSET}/icon_128x128@2x.png"
          sips -z 256 256   "${ICON_SRC}" --out "${ICONSET}/icon_256x256.png"
          sips -z 512 512   "${ICON_SRC}" --out "${ICONSET}/icon_256x256@2x.png"
          sips -z 512 512   "${ICON_SRC}" --out "${ICONSET}/icon_512x512.png"
          sips -z 1024 1024 "${ICON_SRC}" --out "${ICONSET}/icon_512x512@2x.png"

          # Convert to icns
          iconutil -c icns "${ICONSET}" -o AppIcon.icns
          rm -rf "${ICONSET}"

      - name: Create App Bundle
        run: |
          cd macOS
          APP_NAME="SeekQool"
          BUILD_DIR=".build/release"
          APP_DIR="${APP_NAME}.app"

          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp "${BUILD_DIR}/${APP_NAME}" "${APP_DIR}/Contents/MacOS/"
          cp "AppIcon.icns" "${APP_DIR}/Contents/Resources/"

          # Create Info.plist
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "${APP_DIR}/Contents/Info.plist" << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SeekQool</string>
              <key>CFBundleIdentifier</key>
              <string>com.foxwiseai.seekqool</string>
              <key>CFBundleName</key>
              <string>SeekQool</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.developer-tools</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          PLISTEOF

          # Add version
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${VERSION}" "${APP_DIR}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION}" "${APP_DIR}/Contents/Info.plist"

      - name: Create DMG
        run: |
          cd macOS
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="SeekQool-${VERSION}.dmg"

          # Create temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R SeekQool.app dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "SeekQool" -srcfolder dmg_contents -ov -format UDZO "${DMG_NAME}"

          rm -rf dmg_contents

      - name: Create ZIP
        run: |
          cd macOS
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "SeekQool-${VERSION}.zip" SeekQool.app

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macOS/SeekQool-*.dmg
            macOS/SeekQool-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
